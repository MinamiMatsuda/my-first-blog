<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>料理の追加 - チヨちゃんの絶品晩ご飯</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #fff0f5; 
            font-family: 'Zen Maru Gothic', sans-serif;
            color: #333333;
        }
        .header-bar { 
            background-color: #ffe4e8; 
            padding: 18px 0; 
            border-bottom: 2px solid #ffccd5; 
        }
        .app-title { font-weight: 700; color: #4a3b32; }
        .card { 
            border-radius: 16px; 
            border: 1px solid #ffe0e6; 
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.25); 
        }
        .btn-pink {
            background-color: #ff6b81;
            border-color: #ff6b81;
            color: #ffffff;
            font-weight: 700;
        }
        .btn-pink:hover {
            background-color: #ee5253;
            border-color: #ee5253;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header class="header-bar text-center mb-4 shadow-sm">
        <h1 class="h4 mb-0 app-title">新しい料理を追加 🍳</h1>
    </header>

    <main class="container" style="max-width: 500px;">
        <div class="card p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">料理名 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control rounded-pill" placeholder="例：肉じゃが、オムライス" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">メモ・ポイント（自由）</label>
                    <input type="text" name="memo" class="form-control rounded-pill" placeholder="例：玉ねぎ多めが好評、隠し味にみりん">
                </div>

                <button type="submit" class="btn btn-pink w-100 rounded-pill py-2 mb-3">この料理を登録する ✨</button>
                <a href="{% url 'today_menu' %}" class="btn btn-outline-secondary w-100 rounded-pill btn-sm">もどる</a>
            </form>
        </div>
    </main>
</body>
</html>
